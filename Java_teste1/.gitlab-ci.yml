stages:
  - install
  - test
  - report

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

install_dependencies:
  stage: install
  image: node:24
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

run_tests:
  stage: test
  image: node:24
  dependencies:
    - install_dependencies
  script:
    # Rodar os testes via BrowserStack para execução na nuvem dentro do pipeline CI/CD
    - npm run wdio
  variables:
    BROWSERSTACK: "true"
    AI_MONITOR: "false"
    BROWSERSTACK_USERNAME: $BROWSERSTACK_USERNAME
    BROWSERSTACK_ACCESS_KEY: $BROWSERSTACK_ACCESS_KEY
    BROWSERSTACK_APP_ID: $BROWSERSTACK_APP_ID
  artifacts:
    when: always
    paths:
      - allure-results/
    expire_in: 7 days

generate_report:
  stage: report
  image: node:24
  dependencies:
    - run_tests
  script:
    - npx allure generate allure-results --clean
  artifacts:
    paths:
      - allure-report/
    expire_in: 14 days
  when: always

ai_review:
  stage: report
  image: node:24
  dependencies:
    - install_dependencies
    - run_tests
  # Requer variáveis CI/CD (masked): GEMINI_API_KEY e GITLAB_TOKEN (escopo "api")
  script:
    - npm run rag:index
    - npm run ai:monitor
    - npm run ai:comment
  artifacts:
    when: always
    paths:
      - ai-reports/
    expire_in: 14 days
  when: always
  allow_failure: true
