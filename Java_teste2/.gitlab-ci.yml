stages:
  - install
  - test
  - report

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/

install_dependencies:
  stage: install
  image: node:24
  script:
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

test_mocha:
  stage: test
  image: node:24
  dependencies:
    - install_dependencies
  script:
    # Executa a suite de testes de API (Mocha + SuperTest) e gera os resultados para o Allure
    - npm test
  artifacts:
    when: always
    paths:
      - allure-results/
    expire_in: 7 days

test_newman:
  stage: test
  image: node:24
  dependencies:
    - install_dependencies
  script:
    # Executa a suite de testes do Postman via Newman CLI
    - npm run test:postman
  artifacts:
    when: always
    paths:
      - postman/newman-report.html
    reports:
      junit: postman/newman-report.xml
    expire_in: 7 days

generate_report:
  stage: report
  image: node:24
  dependencies:
    - test_mocha
  script:
    - npx allure generate allure-results --clean
  artifacts:
    paths:
      - allure-report/
    expire_in: 14 days
  when: always
